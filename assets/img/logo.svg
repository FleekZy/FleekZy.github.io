<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="FleekZy">
  <style>
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff2a2a" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ff2a2a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>
  <circle cx="64" cy="64" r="64" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="64" fill="url(#grid)"/>
  <circle cx="60" cy="66" r="46" fill="url(#glow)"/>
  <path d="M36 42 L60 64 L36 86" fill="none" stroke="#ff2a2a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="cursor" x="66" y="79" width="28" height="10" rx="2.5" fill="#ffffff"/>
</svg>
